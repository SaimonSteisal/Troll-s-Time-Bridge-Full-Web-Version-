<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      mobileWeb: no user scaling, no pinch zoom -> Phaser owns the whole surface.
      viewport-fit=cover lets us render edge-to-edge on notched devices.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d0b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ashenfall - Action RPG Prototype</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d0b12;
        overflow: hidden;
        /* kill browser touch gestures that fight the virtual joystick */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game-root {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-ClvAQlyu.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/phaser-CaWnzXme.js">
  </head>
  <body>
    <div id="game-root"></div>
  </body>
</html>
